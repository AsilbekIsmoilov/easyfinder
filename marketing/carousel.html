<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>EasyFinder — Instagram karusel</title>
<style>
  /* Ilova palitrasi (frontend/index.html dagi :root dan) */
  :root {
    --accent: #2563eb;
    --accent-deep: #1d4ed8;
    --ink: #101828;
    --ink-soft: #68758a;
    --bg: #f4f7fb;
    --surface: #ffffff;
    --border: rgba(100,116,139,.14);
    /* Instagram karusel: 1080x1350 (4:5) — lentada eng baland ko'rinadigan format */
    --w: 1080px;
    --h: 1350px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    padding: 28px; background: #e8edf4; color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
  }

  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    margin-bottom: 24px; padding: 16px 18px;
    border: 1px solid var(--border); border-radius: 16px;
    background: var(--surface); box-shadow: 0 6px 20px rgba(15,23,42,.07);
  }
  .toolbar b { font-size: 15px; }
  .toolbar span { color: var(--ink-soft); font-size: 13px; }
  .btn {
    padding: 10px 16px; border: 0; border-radius: 10px; cursor: pointer;
    color: #fff; background: var(--accent); font: inherit; font-size: 14px; font-weight: 800;
  }
  .btn.ghost { color: var(--accent); background: #eff6ff; }
  .btn:disabled { opacity: .5; cursor: default; }

  .sheet { display: flex; flex-direction: column; gap: 28px; align-items: flex-start; }

  /* Har slayd aynan 1080x1350. Ekranda kichraytirib ko'rsatamiz, lekin
     PNG ga to'liq o'lchamda chiqadi. */
  .slide {
    position: relative; width: var(--w); height: var(--h); overflow: hidden;
    transform-origin: top left; background: var(--bg);
    display: flex; flex-direction: column;
  }
  .scaled { height: calc(var(--h) * var(--k)); }
  .scaled > .slide { transform: scale(var(--k)); }

  .slide-no {
    margin-bottom: 8px; color: var(--ink-soft); font-size: 13px; font-weight: 800;
    letter-spacing: .08em; text-transform: uppercase;
  }

  /* ---- Umumiy qismlar ---- */
  .brand {
    display: flex; align-items: center; gap: 16px;
    padding: 52px 64px 0; color: var(--ink);
  }
  .brand .mark {
    width: 56px; height: 56px; display: grid; place-items: center;
    border-radius: 16px; color: #fff; background: var(--accent);
    font-size: 30px; line-height: 1;
  }
  .brand .name { font-size: 27px; font-weight: 900; letter-spacing: -.5px; }

  .foot {
    margin-top: auto; padding: 0 64px 56px;
    display: flex; align-items: center; justify-content: space-between;
    color: var(--ink-soft); font-size: 22px; font-weight: 700;
  }
  .foot .handle { color: var(--accent); font-weight: 900; }

  /* ---- 1: muqova ---- */
  .cover { background: linear-gradient(160deg, #1d4ed8 0%, #2563eb 48%, #3b82f6 100%); }
  .cover .brand, .cover .foot { color: #fff; }
  .cover .brand .mark { color: var(--accent); background: #fff; }
  .cover .foot { color: rgba(255,255,255,.72); }
  .cover .foot .handle { color: #fff; }
  .cover-body { padding: 0 64px; margin-top: 110px; }
  .cover-kicker {
    display: inline-block; margin-bottom: 26px; padding: 12px 20px;
    border-radius: 999px; background: rgba(255,255,255,.16);
    color: #fff; font-size: 23px; font-weight: 800;
  }
  .cover h1 {
    color: #fff; font-size: 96px; font-weight: 900; line-height: 1.02; letter-spacing: -3px;
  }
  .cover h1 em { font-style: normal; color: #bfdbfe; }
  .cover p {
    margin-top: 34px; max-width: 760px;
    color: rgba(255,255,255,.88); font-size: 32px; font-weight: 600; line-height: 1.4;
  }
  .cover-stats { display: flex; gap: 56px; margin-top: 64px; }
  .cover-stats div span {
    display: block; color: #fff; font-size: 80px; font-weight: 900; line-height: 1; letter-spacing: -2px;
  }
  .cover-stats div small {
    display: block; margin-top: 10px;
    color: rgba(255,255,255,.75); font-size: 24px; font-weight: 700;
  }

  /* ---- 2..N: davlat ---- */
  .country-body { padding: 0 64px; margin-top: 88px; }
  .flag { font-size: 150px; line-height: 1; }
  .country-name {
    margin-top: 22px; font-size: 76px; font-weight: 900; letter-spacing: -2px; line-height: 1.05;
  }
  .price-block { margin-top: 56px; }
  .price-label {
    color: var(--ink-soft); font-size: 25px; font-weight: 800;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .price {
    margin-top: 10px; color: var(--accent);
    font-size: 176px; font-weight: 900; line-height: .95; letter-spacing: -6px;
  }
  .price small { font-size: 46px; font-weight: 800; letter-spacing: -1px; }

  .facts { display: flex; gap: 20px; margin-top: 60px; }
  .fact {
    flex: 1; padding: 30px 32px;
    border: 1px solid var(--border); border-radius: 22px; background: var(--surface);
  }
  .fact-label {
    color: var(--ink-soft); font-size: 21px; font-weight: 800;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .fact-value { margin-top: 12px; font-size: 40px; font-weight: 900; letter-spacing: -1px; }

  .agency {
    display: inline-flex; align-items: center; gap: 14px;
    margin-top: 46px; padding: 18px 28px 18px 20px;
    border-radius: 999px; background: #eff6ff;
  }
  .agency .dot {
    width: 44px; height: 44px; display: grid; place-items: center;
    border-radius: 50%; color: #fff; background: var(--accent);
    font-size: 22px; font-weight: 900;
  }
  .agency .who { color: var(--accent-deep); font-size: 26px; font-weight: 800; }

  /* ---- oxirgi: chaqiruv ---- */
  .cta-body { padding: 0 64px; margin-top: 130px; }
  .cta h2 { font-size: 82px; font-weight: 900; line-height: 1.06; letter-spacing: -2.5px; }
  .cta p {
    margin-top: 32px; max-width: 800px;
    color: var(--ink-soft); font-size: 32px; font-weight: 600; line-height: 1.45;
  }
  .steps { margin-top: 62px; display: flex; flex-direction: column; gap: 26px; }
  .step { display: flex; align-items: center; gap: 24px; font-size: 32px; font-weight: 750; }
  .step i {
    flex: 0 0 auto; width: 58px; height: 58px; display: grid; place-items: center;
    border-radius: 50%; color: #fff; background: var(--accent);
    font-style: normal; font-size: 28px; font-weight: 900;
  }
  .link-pill {
    display: inline-block; margin-top: 62px; padding: 26px 40px;
    border-radius: 999px; color: #fff; background: var(--accent);
    font-size: 36px; font-weight: 900; letter-spacing: -.5px;
  }
</style>
</head>
<body>

<div class="toolbar">
  <b>EasyFinder — Instagram karusel</b>
  <span id="meta"></span>
  <span style="flex:1"></span>
  <button class="btn ghost" id="zoomBtn" type="button">Haqiqiy o'lcham</button>
  <button class="btn" id="dlBtn" type="button">Hammasini PNG qilib yuklash</button>
</div>

<div class="sheet" id="sheet"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────
// MA'LUMOT — har hafta shu ro'yxatni yangilang (katalogdagi eng arzonlari).
// Narx USD. "days" bo'sh bo'lsa karta "—" ko'rsatadi.
// ─────────────────────────────────────────────────────────────────────────
const TOTAL = { tours: 400, countries: 19, agencies: 12 };

const ITEMS = [
  { flag: "🇹🇭", country: "Tailand",    price: 395, date: "1-oktabr",   days: 8,    agency: "Mascan Travel" },
  { flag: "🇦🇿", country: "Ozarbayjon", price: 409, date: "28-oktabr",  days: null, agency: "365 TRAVEL" },
  { flag: "🇶🇦", country: "Qatar",      price: 515, date: "29-sentabr", days: null, agency: "InApp Travel" },
  { flag: "🇦🇪", country: "BAA",        price: 535, date: "30-sentabr", days: 7,    agency: "InApp Travel" },
  { flag: "🇹🇷", country: "Turkiya",    price: 540, date: "13-oktabr",  days: null, agency: "Mandarin Tour" },
  { flag: "🇪🇬", country: "Misr",       price: 575, date: "24-oktabr",  days: null, agency: "Asialuxe Travel" },
  { flag: "🇱🇰", country: "Shri-Lanka", price: 575, date: "31-oktabr",  days: 8,    agency: "InApp Travel" },
  { flag: "🇬🇪", country: "Gruziya",    price: 611, date: "8-oktabr",   days: null, agency: "Safar Travel" },
];

const BOT = "@easy_finderbot";

// ─────────────────────────────────────────────────────────────────────────
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function coverSlide() {
  return `<div class="slide cover">
    <div class="brand"><span class="mark">🔎</span><span class="name">EasyFinder</span></div>
    <div class="cover-body">
      <span class="cover-kicker">Bu hafta</span>
      <h1>Eng arzon<br>turlar <em>bir joyda</em></h1>
      <p>${TOTAL.agencies} ta agentlikning takliflari bitta ro'yxatda. Narxni solishtiring — biz komissiya olmaymiz.</p>
      <div class="cover-stats">
        <div><span>${TOTAL.tours}+</span><small>tur</small></div>
        <div><span>${TOTAL.countries}</span><small>davlat</small></div>
        <div><span>${TOTAL.agencies}</span><small>agentlik</small></div>
      </div>
    </div>
    <div class="foot"><span>Suring →</span><span class="handle">${esc(BOT)}</span></div>
  </div>`;
}

function countrySlide(item, index) {
  // Katalogdagi turlarning uchdan ikkisida davomiylik yo'q (manba postda
  // yozilmagan). Bo'sh "—" ko'rsatish o'rniga sana katakchasini butun enga
  // yoyamiz — slayd to'liq va ataylab shunday qilingandek ko'rinadi.
  const facts = item.days
    ? `<div class="fact"><div class="fact-label">Jo'nash</div><div class="fact-value">${esc(item.date)}</div></div>
       <div class="fact"><div class="fact-label">Davomiylik</div><div class="fact-value">${item.days} kun</div></div>`
    : `<div class="fact"><div class="fact-label">Jo'nash sanasi</div><div class="fact-value">${esc(item.date)}</div></div>`;
  return `<div class="slide">
    <div class="brand"><span class="mark">🔎</span><span class="name">EasyFinder</span></div>
    <div class="country-body">
      <div class="flag">${item.flag}</div>
      <div class="country-name">${esc(item.country)}</div>
      <div class="price-block">
        <div class="price-label">Eng arzon</div>
        <div class="price">$${item.price}<small> dan</small></div>
      </div>
      <div class="facts">${facts}</div>
      <div class="agency">
        <span class="dot">${esc(item.agency.charAt(0))}</span>
        <span class="who">${esc(item.agency)}</span>
      </div>
    </div>
    <div class="foot"><span>${index} / ${ITEMS.length}</span><span class="handle">${esc(BOT)}</span></div>
  </div>`;
}

function ctaSlide() {
  return `<div class="slide cta">
    <div class="brand"><span class="mark">🔎</span><span class="name">EasyFinder</span></div>
    <div class="cta-body">
      <h2>Hammasini<br>ko'rib chiqing</h2>
      <p>Davlat, narx va sana bo'yicha filtrlang. Tur yoqsa — e'lon bergan agentlikka to'g'ridan-to'g'ri o'tasiz.</p>
      <div class="steps">
        <div class="step"><i>1</i> Botni oching</div>
        <div class="step"><i>2</i> Filtrlang va solishtiring</div>
        <div class="step"><i>3</i> Agentlik bilan bog'laning</div>
      </div>
      <div class="link-pill">${esc(BOT)}</div>
    </div>
    <div class="foot"><span>Havola bio'da 👆</span><span class="handle">${TOTAL.tours}+ tur</span></div>
  </div>`;
}

const slidesHtml = [coverSlide(), ...ITEMS.map(countrySlide), ctaSlide()];
const sheet = document.getElementById("sheet");
sheet.innerHTML = slidesHtml
  .map((html, i) => `<div><div class="slide-no">Slayd ${i + 1} / ${slidesHtml.length}</div><div class="scaled">${html}</div></div>`)
  .join("");
document.getElementById("meta").textContent =
  `${slidesHtml.length} slayd · 1080×1350 · ${TOTAL.tours}+ tur`;

// Ekranda kichraytirib ko'rsatamiz; PNG to'liq o'lchamda chiqadi.
let zoomed = false;
function applyScale() {
  const k = zoomed ? 1 : Math.min(1, (window.innerWidth - 100) / 1080);
  document.querySelectorAll(".scaled").forEach((el) => el.style.setProperty("--k", k));
}
applyScale();
window.addEventListener("resize", applyScale);
document.getElementById("zoomBtn").addEventListener("click", (e) => {
  zoomed = !zoomed;
  e.target.textContent = zoomed ? "Kichraytirish" : "Haqiqiy o'lcham";
  applyScale();
});

// ─────────────────────────────────────────────────────────────────────────
// PNG eksport: slaydni SVG foreignObject ichiga solib canvas ga chizamiz.
// Tashqi kutubxona kerak emas — internetsiz ham ishlaydi.
// ─────────────────────────────────────────────────────────────────────────
function slideToPng(node, fileName) {
  return new Promise((resolve, reject) => {
    const clone = node.cloneNode(true);
    clone.style.transform = "none";
    const css = Array.from(document.styleSheets)
      .flatMap((s) => { try { return Array.from(s.cssRules).map((r) => r.cssText); } catch { return []; } })
      .join("\n");
    const html =
      `<div xmlns="http://www.w3.org/1999/xhtml"><style>${css}</style>${clone.outerHTML}</div>`;
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350">` +
      `<foreignObject width="100%" height="100%">${html}</foreignObject></svg>`;
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = 1080; canvas.height = 1350;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#f4f7fb";
      ctx.fillRect(0, 0, 1080, 1350);
      ctx.drawImage(img, 0, 0);
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = fileName;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        resolve();
      }, "image/png");
    };
    img.onerror = () => reject(new Error("SVG rasmga aylanmadi"));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}

document.getElementById("dlBtn").addEventListener("click", async (e) => {
  const button = e.target;
  const nodes = Array.from(document.querySelectorAll(".slide"));
  button.disabled = true;
  try {
    for (let i = 0; i < nodes.length; i++) {
      button.textContent = `Yuklanmoqda ${i + 1}/${nodes.length}...`;
      await slideToPng(nodes[i], `easyfinder-${String(i + 1).padStart(2, "0")}.png`);
      await new Promise((r) => setTimeout(r, 350));   // brauzer ketma-ket yuklashga ulgursin
    }
    button.textContent = "Tayyor ✓";
  } catch (err) {
    button.textContent = "Xato — skrinshot oling";
    console.error(err);
  } finally {
    setTimeout(() => { button.disabled = false; button.textContent = "Hammasini PNG qilib yuklash"; }, 2500);
  }
});
</script>
</body>
</html>
