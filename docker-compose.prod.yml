services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .env.mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["migrate"]
    restart: "no"
    env_file: backend/.env.production
    environment:
      RUN_STARTUP_MIGRATIONS: "false"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["api"]
    restart: unless-stopped
    env_file: backend/.env.production
    environment:
      RUN_STARTUP_MIGRATIONS: "false"
      WEB_CONCURRENCY: "2"
    # Port tashqariga chiqarilmaydi — faqat Caddy ichki tarmoq orqali murojaat
    # qiladi. Bu API ni to'g'ridan-to'g'ri IP orqali ochilishidan himoya qiladi.
    expose:
      - "8000"
    volumes:
      - ./backend/media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["worker"]
    restart: unless-stopped
    env_file: backend/.env.production
    environment:
      RUN_STARTUP_MIGRATIONS: "false"
    volumes:
      - ./backend/media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["scheduler"]
    restart: unless-stopped
    env_file: backend/.env.production
    environment:
      RUN_STARTUP_MIGRATIONS: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # sertifikatlar shu yerda, o'chirmang
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    env_file: backend/.env.production
    depends_on:
      api:
        condition: service_healthy
    profiles: ["tunnel"]
    networks: [backend]

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge