services:
  mysql:
    image: mysql:8.0
    container_name: tour-finder-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tour_finder
      MYSQL_USER: tour_user
      MYSQL_PASSWORD: tour_dev_password
      MYSQL_ROOT_PASSWORD: tour_root_dev_password
      TZ: Asia/Tashkent
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - tour_finder_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptour_root_dev_password"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: tour-finder-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - tour_finder_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tour_finder_mysql_data:
  tour_finder_redis_data: